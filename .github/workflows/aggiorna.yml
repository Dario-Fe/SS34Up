name: Aggiorna dati SS34Up

on:
  schedule:
    # Al minuto 15, non a :00: l'inizio dell'ora è il momento più congestionato
    # dello scheduler di GitHub e le run arrivano in ritardo o non arrivano.
    - cron: "15 8,9,16,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-ss34up
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            scraper/requirements.txt
            requirements-dev.txt

      - name: Installa dipendenze
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # Guardia basata sull'età dei dati, non sull'ora: una run consegnata in
      # ritardo da GitHub non viene più sprecata e, se una run si perde, la
      # successiva recupera. La soglia resta sotto le 7 ore che separano i
      # trigger di backup (09:15) da quelli serali (16:15), così lo slot
      # serale parte anche quando quello mattutino è arrivato in ritardo.
      - name: Verifica età dell'ultimo aggiornamento
        id: finestra
        if: github.event_name == 'schedule'
        shell: bash
        env:
          MIN_AGE_HOURS: "6"
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          threshold = float(os.environ["MIN_AGE_HOURS"])

          try:
              with open("data.json", encoding="utf-8") as handle:
                  last = datetime.fromisoformat(json.load(handle)["meta"]["generated_at"])
              if last.tzinfo is None:
                  last = last.replace(tzinfo=timezone.utc)
              age = (datetime.now(timezone.utc) - last).total_seconds() / 3600
              run = age >= threshold
              print(
                  f"Ultimo controllo: {last.isoformat()} ({age:.1f} h fa); "
                  f"soglia {threshold:g} h -> {'eseguo' if run else 'salto'}"
              )
          except (OSError, ValueError, KeyError, TypeError) as exc:
              print(f"generated_at non leggibile ({exc}): eseguo comunque")
              run = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"run={'true' if run else 'false'}\n")
          PY

      - name: Aggiorna data.json
        if: github.event_name == 'workflow_dispatch' || steps.finestra.outputs.run == 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python scraper/scraper_ss34up.py

      - name: Test
        if: github.event_name == 'workflow_dispatch' || steps.finestra.outputs.run == 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

      - name: Commit solo se i dati cambiano
        if: github.event_name == 'workflow_dispatch' || steps.finestra.outputs.run == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data.json; then
            echo "Nessuna modifica a data.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Aggiorna dati SS34Up"
          git push
