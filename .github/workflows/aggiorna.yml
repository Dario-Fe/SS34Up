name: Aggiorna dati SS34Up

on:
  schedule:
    - cron: "0 8,9,16,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-ss34up
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            scraper/requirements.txt
            requirements-dev.txt

      - name: Installa dipendenze
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verifica finestra oraria italiana
        id: finestra
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          HOUR=$(TZ=Europe/Rome date +%H)
          echo "Ora italiana: $HOUR"
          if [ "$HOUR" = "10" ] || [ "$HOUR" = "18" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Aggiorna data.json
        if: github.event_name == 'workflow_dispatch' || steps.finestra.outputs.run == 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python scraper/scraper_ss34up.py

      - name: Test
        if: github.event_name == 'workflow_dispatch' || steps.finestra.outputs.run == 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

      - name: Commit solo se i dati cambiano
        if: github.event_name == 'workflow_dispatch' || steps.finestra.outputs.run == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data.json; then
            echo "Nessuna modifica a data.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Aggiorna dati SS34Up"
          git push
